; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:transmitter]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	madhephaestus/ESP32Servo @ ^3.0.5
	olikraus/U8g2 @ ^2.35.0
build_flags = -D IS_TRANSMITTER=1 -D BAUD_RATE=115200 -Isrc
build_src_filter = +<main_transmitter.cpp> +<drivers/> +<config/> -<drivers/esc/> -<drivers/servo/> -<drivers/hall/>
monitor_speed = 115200

[env:receiver]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	madhephaestus/ESP32Servo @ ^3.0.5
build_flags = -D IS_RECEIVER=1 -D BAUD_RATE=115200 -Isrc
build_src_filter = +<main_receiver.cpp> +<drivers/> +<config/> -<drivers/screen/>
monitor_speed = 115200

[env:native]
platform = native
build_flags = -std=c++17 -Isrc
; Exclude all production src files — tests only depend on header-only logic files
build_src_filter = -<*>
