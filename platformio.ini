; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:transmitter]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	madhephaestus/ESP32Servo @ ^3.0.5
	olikraus/U8g2 @ ^2.35.0
build_flags = -D IS_TRANSMITTER=1 -D BAUD_RATE=115200 -Isrc
; Transmitter: drivers (minus receiver-only actuators) + comm + ui + app.
; comm/VehicleCommandReceiver is receiver-only and pulls in the excluded actuators.
build_src_filter = +<main_transmitter.cpp> +<config/> +<drivers/> +<comm/> +<ui/> +<app/> -<drivers/esc/> -<drivers/servo/> -<drivers/hall/> -<comm/VehicleCommandReceiver.cpp>
monitor_speed = 115200
; Static analysis (make check-tx / runs before every build) — cppcheck is bundled with PlatformIO.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<src/>
check_severity = low, medium, high
check_flags =
	cppcheck: --enable=warning,style,performance,portability --inline-suppr --std=c++17 --suppress=*:*/.pio/* --suppress=unmatchedSuppression

[env:receiver]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	madhephaestus/ESP32Servo @ ^3.0.5
build_flags = -D IS_RECEIVER=1 -D BAUD_RATE=115200 -Isrc
; Receiver is headless: drivers (minus the display panel) + comm only — no ui/app.
; The transmitter-only comm files (link/send/handshake) are excluded.
build_src_filter = +<main_receiver.cpp> +<config/> +<drivers/> +<comm/> -<drivers/display/> -<drivers/controls/DebugModeSwitch.cpp> -<drivers/debug/PacketTrace.cpp> -<comm/ChannelSync.cpp> -<comm/TelemetryLink.cpp> -<comm/JoystickSender.cpp> -<comm/LinkModeController.cpp>
monitor_speed = 115200
; Static analysis (make check-rx / runs before every build) — cppcheck is bundled with PlatformIO.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<src/>
check_severity = low, medium, high
check_flags =
	cppcheck: --enable=warning,style,performance,portability --inline-suppr --std=c++17 --suppress=*:*/.pio/* --suppress=unmatchedSuppression

[env:native]
platform = native
build_flags = -std=c++17 -Isrc
; Exclude all production src files — tests only depend on header-only logic files
build_src_filter = -<*>
